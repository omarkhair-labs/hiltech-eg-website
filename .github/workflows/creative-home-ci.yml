name: Creative Home CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.mjs'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/creative-home-ci.yml'

jobs:
  build:
    if: github.head_ref == 'redesign/creative-system-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium for visual QA
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/hiltech-next.log 2>&1 &
          echo $! > /tmp/hiltech-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hiltech-next.log
          exit 1

      - name: Capture desktop visual QA
        run: |
          mkdir -p visual-qa
          for chapter in h01 h02 h03; do
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=2500 "http://127.0.0.1:3000/#$chapter" "visual-qa/desktop-$chapter.png"
          done

      - name: Capture mobile visual QA
        run: |
          for chapter in h01 h02 h03; do
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=2500 "http://127.0.0.1:3000/#$chapter" "visual-qa/mobile-$chapter.png"
          done

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-home-visual-qa
          path: visual-qa/
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/hiltech-next.pid ]; then
            kill "$(cat /tmp/hiltech-next.pid)" || true
          fi
