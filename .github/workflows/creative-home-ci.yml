name: Creative Public CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.mjs'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'scripts/capture-home-qa.mjs'
      - 'scripts/capture-home-smoke-qa.mjs'
      - 'scripts/capture-solutions-qa.mjs'
      - 'scripts/capture-services-qa.mjs'
      - 'scripts/capture-products-qa.mjs'
      - 'scripts/capture-work-qa.mjs'
      - 'scripts/capture-company-qa.mjs'
      - 'scripts/capture-rfq-contact-qa.mjs'
      - 'scripts/capture-creative-synthesis-qa.mjs'
      - 'scripts/capture-product-rnd-qa.mjs'
      - 'scripts/capture-public-utility-qa.mjs'
      - 'scripts/capture-closed-public-smoke.mjs'
      - '.github/workflows/creative-home-ci.yml'

concurrency:
  group: creative-home-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'redesign/creative-system-20260831' || startsWith(github.head_ref, 'award/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium for visual QA
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/hiltech-next.log 2>&1 &
          echo $! > /tmp/hiltech-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hiltech-next.log
          exit 1

      - name: Capture closed public regression smoke
        run: node scripts/capture-closed-public-smoke.mjs

      - name: Capture Work visual and interaction QA
        run: node scripts/capture-work-qa.mjs

      - name: Capture Company visual and interaction QA
        run: node scripts/capture-company-qa.mjs

      - name: Capture RFQ and Contact visual and interaction QA
        run: node scripts/capture-rfq-contact-qa.mjs

      - name: Capture public utility and Search QA
        run: node scripts/capture-public-utility-qa.mjs

      - name: Capture Product visual R&D QA
        run: node scripts/capture-product-rnd-qa.mjs

      - name: Upload closed public regression smoke
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-closed-public-regression-smoke
          path: visual-qa-closed-public-smoke/
          retention-days: 7

      - name: Upload Work visual QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-work-visual-qa
          path: visual-qa-work/
          retention-days: 7

      - name: Upload Company visual QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-company-visual-qa
          path: visual-qa-company/
          retention-days: 7

      - name: Upload RFQ and Contact visual QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-rfq-contact-visual-qa
          path: visual-qa-rfq-contact/
          retention-days: 7

      - name: Upload public utility and Search QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-public-utility-visual-qa
          path: visual-qa-public-utility/
          retention-days: 7

      - name: Upload Product visual R&D QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-product-rnd-visual-qa
          path: visual-qa-product-rnd/
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/hiltech-next.pid ]; then
            kill "$(cat /tmp/hiltech-next.pid)" || true
          fi


  synthesis:
    if: github.head_ref == 'redesign/creative-system-20260831' || startsWith(github.head_ref, 'award/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium for synthesis QA
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/hiltech-next-synthesis.log 2>&1 &
          echo $! > /tmp/hiltech-next-synthesis.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hiltech-next-synthesis.log
          exit 1

      - name: Capture English creative synthesis QA
        run: node scripts/capture-creative-synthesis-qa.mjs

      - name: Upload English creative synthesis QA
        uses: actions/upload-artifact@v4
        with:
          name: hiltech-creative-synthesis-visual-qa
          path: visual-qa-creative-synthesis/
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/hiltech-next-synthesis.pid ]; then
            kill "$(cat /tmp/hiltech-next-synthesis.pid)" || true
          fi
